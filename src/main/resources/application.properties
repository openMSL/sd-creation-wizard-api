sdcreationwizard.gx4fm.enabled = false

# OMB repository URL and structure (overridable via env: GX4FM_REPO_URL, GX4FM_SHAPES_ROOT)
# sdcreationwizard.gx4fm.repo-url = https://github.com/ASCS-eV/ontology-management-base.git
# sdcreationwizard.gx4fm.shapes-root = artifacts

# When GX4FM_LOCAL_PATH is set (e.g. via Docker volume mount), the service
# reads OMB artifacts from that local directory instead of cloning from GitHub.
# sdcreationwizard.gx4fm.local-path =

# ENVITED-X ecosystem (overridable via env: ENVITEDX_ENABLED)
# When enabled, OMB domain shapes (hdmap, georeference, etc.) are registered
# as the "envited-x" ecosystem in the wizard's shape selector.
# sdcreationwizard.envitedx.enabled = true
